name: Release

# Fired by pushing a v* tag (scripts/release.sh cuts these). Builds
# release binaries for Windows / Linux / macOS (Intel + Apple Silicon),
# packages and verifies each archive with README + CHANGELOG + LICENSE,
# generates SHA256SUMS.txt, and attaches them to the GitHub release —
# so teammates run RIONT without a Rust toolchain.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu, ext: "",     rustflags: "",                             pkg_flags: "" }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,   ext: ".exe", rustflags: "-C target-feature=+crt-static", pkg_flags: "--require-static-crt" }
          - { os: macos-latest,   target: aarch64-apple-darwin,     ext: "",     rustflags: "",                             pkg_flags: "" }
          - { os: macos-latest,   target: x86_64-apple-darwin,      ext: "",     rustflags: "",                             pkg_flags: "--skip-exec" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: build release binary
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: package and verify
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          EXT: ${{ matrix.ext }}
          PKG_FLAGS: ${{ matrix.pkg_flags }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python scripts/package.py \
            --version "$VERSION" \
            --target "$TARGET" \
            --binary "target/$TARGET/release/riont$EXT" \
            --out-dir dist \
            $PKG_FLAGS

      - uses: actions/upload-artifact@v4
        with:
          name: riont-${{ matrix.target }}
          path: dist/*

  release:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: extract release notes from CHANGELOG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Pull the "## [X.Y.Z]" section (up to the next "## [") as the
          # release body, falling back to the tag message.
          awk -v sec="## [$VERSION]" '
            index($0, sec) == 1 { f = 1; next }
            f && /^## \[/       { f = 0 }
            f                   { print }
          ' CHANGELOG.md > release_body.md
          [ -s release_body.md ] || echo "RIONT $VERSION" > release_body.md
          cat <<'EOF' >> release_body.md

          ### Install
          **Windows (PowerShell):**
          ```powershell
          irm https://raw.githubusercontent.com/lukalyc/RIoNT/master/scripts/install.ps1 | iex
          ```
          **macOS / Linux:**
          ```sh
          curl -fsSL https://raw.githubusercontent.com/lukalyc/RIoNT/master/scripts/install.sh | sh
          ```
          EOF
      - name: download all packaged binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: verify all release assets and generate checksums
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for asset in \
            "riont-$VERSION-x86_64-pc-windows-msvc.zip" \
            "riont-$VERSION-x86_64-linux-gnu.tar.gz" \
            "riont-$VERSION-aarch64-apple-darwin.tar.gz" \
            "riont-$VERSION-x86_64-apple-darwin.tar.gz"; do
            [ -s "dist/$asset" ] || { echo "ERROR: missing or empty release asset dist/$asset" >&2; exit 1; }
          done
          (cd dist && sha256sum riont-* | sort -k2) > dist/SHA256SUMS.txt
          cat dist/SHA256SUMS.txt
      - name: attach binaries to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_body.md
          files: dist/*
          fail_on_unmatched_files: true
