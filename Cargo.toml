[package]
name = "riont"
description = "RIONT — Robot Inspection Over Network Tables (keyboard-only NT4 dashboard for FRC)"
version = "0.5.2"
edition = "2021"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "net", "io-util", "process"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
rmpv = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
fuzzy-matcher = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arboard = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
